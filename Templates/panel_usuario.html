{% extends 'base.html' %}

{% block titulo %}Panel de Usuario{% endblock %}

{% block contenido %}
<style>
    .main-content-panel {
        min-height: calc(100vh - 150px); /* Ajusta 150px según la altura de tu navbar y footer */
        display: flex;
        align-items: center;
        justify-content: center;
    }
</style>
<div class="container mt-5 main-content-panel">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Bienvenido a tu Panel de Usuario, {{ usuario }}!</h3>
                </div>
                <div class="card-body">
                    <p class="lead">Aquí podrás ver tu información personal.</p>
                    <p>¡Explora las opciones disponibles en el menú de navegación!</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
